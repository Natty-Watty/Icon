<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Icon</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #080808;
            color: #fff;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(8, 8, 8, 0.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid #1b1b1b;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #8ab4ff;
        }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav button {
            border: 0;
            background: transparent;
            color: #999;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s ease;
            font-size: 14px;
        }

        .nav button:hover,
        .nav button.active {
            background: #171717;
            color: #fff;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 65px 24px 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(42px, 7vw, 76px);
            letter-spacing: -4px;
            line-height: 1;
        }

        .hero p {
            color: #888;
            font-size: 16px;
            margin: 18px auto 28px;
            max-width: 550px;
        }

        .search {
            width: min(650px, 100%);
            margin: auto;
            position: relative;
        }

        .search input {
            width: 100%;
            height: 54px;
            padding: 0 20px;
            border: 1px solid #262626;
            border-radius: 8px;
            outline: none;
            background: #111;
            color: #fff;
            font-size: 15px;
            transition: 0.25s ease;
        }

        .search input:focus {
            border-color: #555;
            background: #141414;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.025);
        }

        .page {
            display: none;
            animation: pageIn 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }

        .icon-card {
            position: relative;
            min-height: 240px;
            padding: 18px;
            background: #111;
            border: 1px solid #202020;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            transition:
                transform 0.3s cubic-bezier(.2,.8,.2,1),
                border-color 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        .icon-card:hover {
            transform: translateY(-5px);
            border-color: #3a3a3a;
            background: #151515;
            box-shadow: 0 16px 45px rgba(0,0,0,.3);
        }

        .icon-preview {
            height: 170px;
            border-radius: 8px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .icon-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 25px;
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
        }

        .icon-card:hover .icon-preview img {
            transform: scale(1.08);
        }

        .icon-name {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-description {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty {
            display: none;
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: min(550px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 8px;
            transform: translateY(20px) scale(.97);
            transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
        }

        .modal.show .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-image {
            width: 100%;
            height: 330px;
            background: #080808;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 40px;
        }

        .modal h2 {
            margin: 20px 0 8px;
            font-size: 23px;
        }

        .modal p {
            margin: 0;
            color: #888;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .actions button {
            flex: 1;
            height: 46px;
            border: 1px solid #292929;
            border-radius: 8px;
            background: #191919;
            color: #fff;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 600;
        }

        .actions button:hover {
            background: #242424;
            transform: translateY(-2px);
        }

        .actions .download {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .actions .download:hover {
            background: #ddd;
        }

        .close {
            width: 100%;
            margin-top: 10px;
            height: 42px;
            border: 0;
            background: transparent;
            color: #777;
            cursor: pointer;
            border-radius: 8px;
            transition: .2s;
        }

        .close:hover {
            background: #191919;
            color: #fff;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 16px;
            }

            .nav button {
                padding: 8px 9px;
            }

            main {
                padding: 45px 16px 60px;
            }

            .icon-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .icon-card {
                min-height: 205px;
                padding: 10px;
            }

            .icon-preview {
                height: 140px;
            }

            .icon-preview img {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Free <span>Icon</span></div>

    <div class="nav">
        <button class="active" data-page="icons">Icons</button>
        <button data-page="about">About</button>
    </div>
</header>

<main>
    <section id="icons" class="page active">
        <div class="hero">
            <h1>Free Icon</h1>
            <p>Find free icons for your websites and apps.</p>

            <div class="search">
                <input id="search" type="text" placeholder="Search icons...">
            </div>
        </div>

        <div id="iconGrid" class="icon-grid"></div>

        <div id="empty" class="empty">
            No icons found.
        </div>
    </section>

    <section id="about" class="page">
        <div class="hero">
            <h1>About</h1>
            <p>Free Icon is a simple collection of icons made for websites and apps.</p>
        </div>
    </section>
</main>

<div id="modal" class="modal">
    <div class="modal-box">
        <div class="modal-image">
            <img id="modalImage">
        </div>

        <h2 id="modalName"></h2>
        <p id="modalDescription"></p>

        <div class="actions">
            <button class="download" id="downloadButton">Download</button>
            <button id="copyButton">Copy Link</button>
        </div>

        <button class="close" id="closeButton">Close</button>
    </div>
</div>

<script>
    const grid = document.getElementById("iconGrid");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");

    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modalImage");
    const modalName = document.getElementById("modalName");
    const modalDescription = document.getElementById("modalDescription");
    const downloadButton = document.getElementById("downloadButton");
    const copyButton = document.getElementById("copyButton");
    const closeButton = document.getElementById("closeButton");

    let icons = [];
    let selectedIcon = null;

    async function loadIcons() {
        try {
            const response = await fetch("assets/description.json");
            const data = await response.json();

            if (Array.isArray(data)) {
                icons = data;
            } else if (data.icons && Array.isArray(data.icons)) {
                icons = data.icons;
            } else {
                icons = [data];
            }

            renderIcons();
        } catch (error) {
            console.error(error);
            grid.innerHTML = "";
            empty.textContent = "Could not load icons.";
            empty.style.display = "block";
        }
    }

    function getImage(icon) {
        return icon.image || icon.png || icon.file || icon.filename || "";
    }

    function getName(icon) {
        return icon.name || "Unnamed Icon";
    }

    function getDescription(icon) {
        return icon.description || "No description available.";
    }

    function renderIcons() {
        const query = search.value.toLowerCase().trim();

        const filtered = icons.filter(icon => {
            return (
                getName(icon).toLowerCase().includes(query) ||
                getDescription(icon).toLowerCase().includes(query)
            );
        });

        grid.innerHTML = "";

        empty.style.display = filtered.length ? "none" : "block";

        for (const icon of filtered) {
            const image = getImage(icon);

            const card = document.createElement("div");
            card.className = "icon-card";

            card.innerHTML = `
                <div class="icon-preview">
                    <img src="assets/png/${image}" alt="">
                </div>
                <div class="icon-name">${escapeHTML(getName(icon))}</div>
                <div class="icon-description">${escapeHTML(getDescription(icon))}</div>
            `;

            card.addEventListener("click", () => openModal(icon));

            grid.appendChild(card);
        }
    }

    function openModal(icon) {
        selectedIcon = icon;

        const image = getImage(icon);

        modalImage.src = "assets/png/" + image;
        modalName.textContent = getName(icon);
        modalDescription.textContent = getDescription(icon);

        modal.classList.add("show");
    }

    function closeModal() {
        modal.classList.remove("show");
    }

    downloadButton.addEventListener("click", () => {
        if (!selectedIcon) return;

        const image = getImage(selectedIcon);

        const link = document.createElement("a");
        link.href = "assets/png/" + image;
        link.download = image;
        document.body.appendChild(link);
        link.click();
        link.remove();
    });

    copyButton.addEventListener("click", async () => {
        if (!selectedIcon) return;

        const image = getImage(selectedIcon);
        const link = new URL("assets/png/" + image, window.location.href).href;

        await navigator.clipboard.writeText(link);

        const oldText = copyButton.textContent;
        copyButton.textContent = "Copied!";

        setTimeout(() => {
            copyButton.textContent = oldText;
        }, 1200);
    });

    closeButton.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closeModal();
        }
    });

    search.addEventListener("input", renderIcons);

    for (const button of document.querySelectorAll(".nav button")) {
        button.addEventListener("click", () => {
            for (const other of document.querySelectorAll(".nav button")) {
                other.classList.remove("active");
            }

            button.classList.add("active");

            for (const page of document.querySelectorAll(".page")) {
                page.classList.remove("active");
            }

            document.getElementById(button.dataset.page).classList.add("active");
        });
    }

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    loadIcons();
</script>

</body>
</html>
