<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8"> <!-- The normal size is 1.0. -->
    <title>Free Icon</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #080808;
            color: #fff;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0d0d0d;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(8, 8, 8, 0.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid #1b1b1b;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #8ab4ff;
        }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav button {
            border: 0;
            background: transparent;
            color: #999;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s ease;
            font-size: 14px;
        }

        .nav button:hover,
        .nav button.active {
            background: #171717;
            color: #fff;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 65px 24px 80px;
        }

        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(42px, 7vw, 76px);
            letter-spacing: -1px;
            line-height: 1;
        }

        .hero p {
            color: #888;
            font-size: 16px;
            margin: 18px auto 28px;
            max-width: 550px;
        }

        .search {
            width: min(650px, 100%);
            margin: auto;
            position: relative;
            display: flex;
            gap: 8px;
        }

        .search input {
            width: 100%;
            height: 54px;
            padding: 0 20px;
            border: 1px solid #262626;
            border-radius: 8px;
            outline: none;
            background: #111;
            color: #fff;
            font-size: 15px;
            transition: 0.25s ease;
        }

        .search input:focus {
            border-color: #555;
            background: #141414;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.025);
        }

        .advanced-button {
            flex: 0 0 54px;
            width: 54px;
            height: 54px;
            padding: 14px;
            border: 1px solid #262626;
            border-radius: 8px;
            background: #111;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .advanced-button:hover {
            background: #191919;
            border-color: #444;
        }

        .advanced-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .advanced-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.65);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
        }

        .advanced-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .advanced-box {
            width: min(380px, 100%);
            padding: 22px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 10px;
            transform: translateY(12px) scale(.97);
            transition: transform .25s ease;
        }

        .advanced-overlay.show .advanced-box {
            transform: translateY(0) scale(1);
        }

        .advanced-box h2 {
            margin: 0 0 20px;
            font-size: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #292929;
            border-radius: 8px;
            outline: none;
            background: #0b0b0b;
            color: #fff;
            font-size: 14px;
        }

        .field input:focus {
            border-color: #555;
        }

        .field input.error {
            border-color: #ff4d4d;
        }

        .error-text {
            display: none;
            margin-top: 6px;
            color: #ff5c5c;
            font-size: 12px;
        }

        .error-text.show {
            display: block;
        }

        .custom-select {
            position: relative;
            width: 100%;
        }

        .custom-select-button {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid #292929;
            border-radius: 8px;
            outline: none;
            background: #0b0b0b;
            color: #777;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: .2s ease;
        }

        .custom-select-button.selected {
            color: #fff;
        }

        .custom-select-button:hover,
        .custom-select.open .custom-select-button {
            border-color: #555;
        }

        .custom-select-arrow {
            width: 7px;
            height: 7px;
            border-right: 1px solid #888;
            border-bottom: 1px solid #888;
            transform: rotate(45deg) translateY(-2px);
            transition: .2s ease;
        }

        .custom-select.open .custom-select-arrow {
            transform: rotate(225deg) translateY(-1px);
        }

        .custom-options {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 6px);
            z-index: 20;
            padding: 5px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,.45);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px);
            transition: .18s ease;
        }

        .custom-select.open .custom-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-option {
            padding: 10px 11px;
            border-radius: 6px;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            transition: .15s ease;
        }

        .custom-option:hover {
            background: #1b1b1b;
            color: #fff;
        }

        .custom-option.selected {
            background: #181818;
            color: #fff;
        }

        .advanced-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .advanced-actions button {
            flex: 1;
            height: 44px;
            border: 1px solid #292929;
            border-radius: 8px;
            background: #191919;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .advanced-actions button:hover {
            background: #242424;
        }

        .advanced-actions .apply {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .advanced-actions .apply:hover {
            background: #ddd;
        }

        .page {
            display: none;
            animation: pageIn 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 16px;
        }

        .icon-card {
            position: relative;
            min-height: 240px;
            padding: 18px;
            background: #111;
            border: 1px solid #202020;
            border-radius: 8px;
            cursor: pointer;
            overflow: hidden;
            transition:
                transform 0.3s cubic-bezier(.2,.8,.2,1),
                border-color 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;
        }

        .icon-card:hover {
            transform: translateY(-5px);
            border-color: #3a3a3a;
            background: #151515;
            box-shadow: 0 16px 45px rgba(0,0,0,.3);
        }

        .icon-preview {
            height: 170px;
            border-radius: 8px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .icon-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 25px;
            transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
        }

        .icon-card:hover .icon-preview img {
            transform: scale(1.08);
        }

        .icon-name {
            margin-top: 14px;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-description {
            margin-top: 5px;
            color: #777;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-size {
            margin-top: 4px;
            color: #555;
            font-size: 11px;
        }

        .empty {
            display: none;
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: min(550px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 8px;
            transform: translateY(20px) scale(.97);
            transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
        }

        .modal.show .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-image {
            width: 100%;
            height: 330px;
            background: #080808;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 40px;
        }

        .modal h2 {
            margin: 20px 0 8px;
            font-size: 23px;
        }

        .modal p {
            margin: 0;
            color: #888;
            line-height: 1.6;
        }

        .modal-size {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .actions button {
            flex: 1;
            height: 46px;
            border: 1px solid #292929;
            border-radius: 8px;
            background: #191919;
            color: #fff;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 600;
        }

        .actions button:hover {
            background: #242424;
            transform: translateY(-2px);
        }

        .actions .download {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .actions .download:hover {
            background: #ddd;
        }

        .close {
            width: 100%;
            margin-top: 10px;
            height: 42px;
            border: 0;
            background: transparent;
            color: #777;
            cursor: pointer;
            border-radius: 8px;
            transition: .2s;
        }

        .close:hover {
            background: #191919;
            color: #fff;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 16px;
            }

            .nav button {
                padding: 8px 9px;
            }

            main {
                padding: 45px 16px 60px;
            }

            .icon-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .icon-card {
                min-height: 215px;
                padding: 10px;
            }

            .icon-preview {
                height: 140px;
            }

            .icon-preview img {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Free <span>Icon</span></div>

    <div class="nav">
        <button class="active" data-page="icons">Icons</button>
        <button data-page="about">About</button>
    </div>
</header>

<main>
    <section id="icons" class="page active">
        <div class="hero">
            <h1>Free Icon</h1>
            <p>Find free icons for your websites and apps.</p>

            <div class="search">
                <input id="search" type="text" placeholder="Search icons...">

                <button class="advanced-button" id="advancedButton">
                    <img src="https://raw.githubusercontent.com/Natty-Watty/Icon/main/assets/White%20Search%20Icon-nat/White%20Search%20Icon.png" alt="Advanced Search">
                </button>
            </div>
        </div>

        <div id="loading" class="loading">
            Loading icons...
        </div>

        <div id="iconGrid" class="icon-grid"></div>

        <div id="empty" class="empty">
            No icons found.
        </div>
    </section>

    <section id="about" class="page">
        <div class="hero">
            <h1>About</h1>
            <p>Free Icon is a simple collection of icons made for websites and apps.</p>
        </div>
    </section>
</main>

<div id="advancedOverlay" class="advanced-overlay">
    <div class="advanced-box">
        <h2>Advanced Search</h2>

        <div class="field">
            <label>Name</label>
            <input id="advancedName" type="text" placeholder="Icon name...">
            <div id="nameError" class="error-text">Name is required.</div>
        </div>

        <div class="field">
            <label>Size</label>
            <input id="advancedSize" type="text" placeholder="128x128">
        </div>

        <div class="field">
            <label>Description</label>

            <div class="custom-select" id="descriptionSelect">
                <button class="custom-select-button" id="descriptionSelectButton" type="button">
                    <span id="descriptionSelectText">Select description</span>
                    <span class="custom-select-arrow"></span>
                </button>

                <div class="custom-options">
                    <div class="custom-option" data-value="has">Has description</div>
                    <div class="custom-option" data-value="none">No description</div>
                </div>
            </div>
        </div>

        <div class="advanced-actions">
            <button id="advancedCancel">Cancel</button>
            <button class="apply" id="advancedApply">Search</button>
        </div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-box">
        <div class="modal-image">
            <img id="modalImage">
        </div>

        <h2 id="modalName"></h2>
        <p id="modalDescription"></p>
        <div class="modal-size" id="modalSize"></div>

        <div class="actions">
            <button class="download" id="downloadButton">Download</button>
            <button id="copyButton">Copy Link</button>
        </div>

        <button class="close" id="closeButton">Close</button>
    </div>
</div>

<script>
    const grid = document.getElementById("iconGrid");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");
    const loading = document.getElementById("loading");

    const advancedButton = document.getElementById("advancedButton");
    const advancedOverlay = document.getElementById("advancedOverlay");
    const advancedName = document.getElementById("advancedName");
    const advancedSize = document.getElementById("advancedSize");
    const advancedCancel = document.getElementById("advancedCancel");
    const advancedApply = document.getElementById("advancedApply");
    const nameError = document.getElementById("nameError");

    const descriptionSelect = document.getElementById("descriptionSelect");
    const descriptionSelectButton = document.getElementById("descriptionSelectButton");
    const descriptionSelectText = document.getElementById("descriptionSelectText");
    const descriptionOptions = document.querySelectorAll(".custom-option");

    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modalImage");
    const modalName = document.getElementById("modalName");
    const modalDescription = document.getElementById("modalDescription");
    const modalSize = document.getElementById("modalSize");
    const downloadButton = document.getElementById("downloadButton");
    const copyButton = document.getElementById("copyButton");
    const closeButton = document.getElementById("closeButton");

    const API = "https://api.github.com/repos/Natty-Watty/Icon/contents/assets?ref=main";
    const RAW = "https://raw.githubusercontent.com/Natty-Watty/Icon/main/assets/";

    let icons = [];
    let selectedIcon = null;

    let advancedFilters = {
        name: "",
        size: "",
        description: ""
    };

    async function loadIcons() {
        try {
            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("Failed to load assets");
            }

            const files = await response.json();
            const folders = files.filter(file => file.type === "dir");

            for (const folder of folders) {
                try {
                    const folderResponse = await fetch(
                        "https://api.github.com/repos/Natty-Watty/Icon/contents/assets/" +
                        encodeURIComponent(folder.name) +
                        "?ref=main"
                    );

                    if (!folderResponse.ok) {
                        continue;
                    }

                    const folderFiles = await folderResponse.json();

                    const descriptionFile = folderFiles.find(file =>
                        file.type === "file" &&
                        file.name.toLowerCase() === "description.json"
                    );

                    const imageFile = folderFiles.find(file =>
                        file.type === "file" &&
                        /\.(png|jpg|jpeg|webp)$/i.test(file.name)
                    );

                    if (!descriptionFile || !imageFile) {
                        continue;
                    }

                    const descriptionResponse = await fetch(descriptionFile.download_url);

                    if (!descriptionResponse.ok) {
                        continue;
                    }

                    const description = await descriptionResponse.json();

                    icons.push({
                        name: description.name || folder.name,
                        description: description.description || "",
                        size: description.size || "",
                        image: imageFile.name,
                        folder: folder.name
                    });
                } catch (error) {
                    console.error(error);
                }
            }

            loading.style.display = "none";
            renderIcons();
        } catch (error) {
            console.error(error);

            loading.style.display = "none";
            grid.innerHTML = "";
            empty.textContent = "Could not load icons.";
            empty.style.display = "block";
        }
    }

    function isNoDescription(description) {
        const value = String(description || "").trim().toLowerCase();

        return !value || value === "no description.";
    }

    function renderIcons() {
        const normalQuery = search.value.toLowerCase().trim();
        const advancedNameQuery = advancedFilters.name.toLowerCase().trim();
        const advancedSizeQuery = advancedFilters.size.toLowerCase().trim();

        const filtered = icons.filter(icon => {
            const normalMatch =
                !normalQuery ||
                icon.name.toLowerCase().includes(normalQuery) ||
                icon.description.toLowerCase().includes(normalQuery);

            const nameMatch =
                !advancedNameQuery ||
                icon.name.toLowerCase().includes(advancedNameQuery);

            const sizeMatch =
                !advancedSizeQuery ||
                String(icon.size).toLowerCase() === advancedSizeQuery;

            let descriptionMatch = true;

            if (advancedFilters.description === "has") {
                descriptionMatch = !isNoDescription(icon.description);
            }

            if (advancedFilters.description === "none") {
                descriptionMatch = isNoDescription(icon.description);
            }

            return normalMatch && nameMatch && sizeMatch && descriptionMatch;
        });

        grid.innerHTML = "";

        empty.style.display = filtered.length ? "none" : "block";

        for (const icon of filtered) {
            const imageURL = RAW +
                encodeURIComponent(icon.folder) +
                "/" +
                encodeURIComponent(icon.image);

            const card = document.createElement("div");
            card.className = "icon-card";

            card.innerHTML = `
                <div class="icon-preview">
                    <img src="${imageURL}" alt="">
                </div>
                <div class="icon-name">${escapeHTML(icon.name)}</div>
                <div class="icon-description">${escapeHTML(icon.description || "No description.")}</div>
                ${icon.size ? `<div class="icon-size">${escapeHTML(icon.size)}</div>` : ""}
            `;

            card.addEventListener("click", () => openModal(icon));

            grid.appendChild(card);
        }
    }

    function openAdvanced() {
        advancedName.value = advancedFilters.name;
        advancedSize.value = advancedFilters.size;

        setDescriptionValue(advancedFilters.description);

        nameError.classList.remove("show");
        advancedName.classList.remove("error");

        advancedOverlay.classList.add("show");
    }

    function closeAdvanced() {
        advancedOverlay.classList.remove("show");
        descriptionSelect.classList.remove("open");
    }

    function setDescriptionValue(value) {
        const option = [...descriptionOptions].find(item =>
            item.dataset.value === value
        );

        if (option) {
            descriptionSelectText.textContent = option.textContent;
            descriptionSelectButton.classList.add("selected");

            for (const other of descriptionOptions) {
                other.classList.remove("selected");
            }

            option.classList.add("selected");
        } else {
            descriptionSelectText.textContent = "Select description";
            descriptionSelectButton.classList.remove("selected");

            for (const other of descriptionOptions) {
                other.classList.remove("selected");
            }
        }
    }

    descriptionSelectButton.addEventListener("click", event => {
        event.stopPropagation();

        descriptionSelect.classList.toggle("open");
    });

    for (const option of descriptionOptions) {
        option.addEventListener("click", () => {
            advancedFilters.description = option.dataset.value;

            setDescriptionValue(option.dataset.value);

            descriptionSelect.classList.remove("open");
        });
    }

    document.addEventListener("click", event => {
        if (!descriptionSelect.contains(event.target)) {
            descriptionSelect.classList.remove("open");
        }
    });

    advancedButton.addEventListener("click", openAdvanced);

    advancedCancel.addEventListener("click", closeAdvanced);

    advancedApply.addEventListener("click", () => {
        const name = advancedName.value.trim();

        if (!name) {
            advancedName.classList.add("error");
            nameError.classList.add("show");
            advancedName.focus();
            return;
        }

        advancedName.classList.remove("error");
        nameError.classList.remove("show");

        advancedFilters = {
            name: name,
            size: advancedSize.value.trim(),
            description: advancedFilters.description
        };

        search.value = "";

        renderIcons();
        closeAdvanced();
    });

    advancedName.addEventListener("input", () => {
        if (advancedName.value.trim()) {
            advancedName.classList.remove("error");
            nameError.classList.remove("show");
        }
    });

    advancedOverlay.addEventListener("click", event => {
        if (event.target === advancedOverlay) {
            closeAdvanced();
        }
    });

    function openModal(icon) {
        selectedIcon = icon;

        const imageURL = RAW +
            encodeURIComponent(icon.folder) +
            "/" +
            encodeURIComponent(icon.image);

        modalImage.src = imageURL;
        modalName.textContent = icon.name;
        modalDescription.textContent = isNoDescription(icon.description)
            ? "No description."
            : icon.description;
        modalSize.textContent = icon.size ? "Size: " + icon.size : "";

        modal.classList.add("show");
    }

    function closeModal() {
        modal.classList.remove("show");
    }

    downloadButton.addEventListener("click", () => {
        if (!selectedIcon) {
            return;
        }

        const imageURL = RAW +
            encodeURIComponent(selectedIcon.folder) +
            "/" +
            encodeURIComponent(selectedIcon.image);

        const link = document.createElement("a");

        link.href = imageURL;
        link.download = selectedIcon.image;
        link.target = "_blank";

        document.body.appendChild(link);
        link.click();
        link.remove();
    });

    copyButton.addEventListener("click", async () => {
        if (!selectedIcon) {
            return;
        }

        const imageURL = RAW +
            encodeURIComponent(selectedIcon.folder) +
            "/" +
            encodeURIComponent(selectedIcon.image);

        try {
            await navigator.clipboard.writeText(imageURL);

            const oldText = copyButton.textContent;

            copyButton.textContent = "Copied!";

            setTimeout(() => {
                copyButton.textContent = oldText;
            }, 1200);
        } catch (error) {
            const textarea = document.createElement("textarea");

            textarea.value = imageURL;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";

            document.body.appendChild(textarea);

            textarea.focus();
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);

            document.execCommand("copy");
            textarea.remove();

            copyButton.textContent = "Copied!";

            setTimeout(() => {
                copyButton.textContent = "Copy Link";
            }, 1200);
        }
    });

    closeButton.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closeModal();
            closeAdvanced();
        }
    });

    search.addEventListener("input", () => {
        advancedFilters = {
            name: "",
            size: "",
            description: ""
        };

        renderIcons();
    });

    for (const button of document.querySelectorAll(".nav button")) {
        button.addEventListener("click", () => {
            for (const other of document.querySelectorAll(".nav button")) {
                other.classList.remove("active");
            }

            button.classList.add("active");

            for (const page of document.querySelectorAll(".page")) {
                page.classList.remove("active");
            }

            document.getElementById(button.dataset.page).classList.add("active");
        });
    }

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    loadIcons();
</script>

</body>
</html>
